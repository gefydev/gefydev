<linearGradient id="vline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22000000000000003"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
