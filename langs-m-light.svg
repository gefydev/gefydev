r="start">Rust</text><text x="40" y="186" class="m n" font-size="13" font-weight="400" fill="#555d80" text-anchor="start">28.5%</text><circle cx="27" cy="207" r="5" fill="#3178c6"/><text x="40" y="212" class="s " font-size="14" font-weight="600" fill="#101426" text-anchor="start">TypeScript</text><text x="40" y="230" class="m n" font-size="13" font-weight="400" fill="#555d80" text-anchor="start">25.4%</text><circle cx="27" cy="251" r="5" fill="#ff5a03"/><text x="40" y="256" class="s " font-size="14" font-weight="600" fill="#101426" text-anchor="start">Astro</text><text x="40" y="274" class="m n" font-size="13" font-weight="400" fill="#555d80" text-anchor="start">16.2%</text><circle cx="27" cy="295" r="5" fill="#f1e05a"/><text x="40" y="300" class="s " font-size="14" font-weight="600" fill="#101426" text-anchor="start">JavaScript</text><text x="40" y="318" class="m n" font-size="13" font-weight="400" fill="#555d80" text-anchor="start">15.8%</text><circle cx="181" cy="163" r="5" fill="#e34c26"/><text x="194" y="168" class="s " font-size="14" font-weight="600" fill="#101426" text-anchor="start">HTML</text><text x="194" y="186" class="m n" font-size="13" font-weight="400" fill="#555d80" text-anchor="start">7.6%</text><circle cx="181" cy="207" r="5" fill="#663399"/><text x="194" y="212" class="s " font-size="14" font-weight="600" fill="#101426" text-anchor="start">CSS</text><text x="194" y="230" class="m n" font-size="13" font-weight="400" fill="#555d80" text-anchor="start">5.1%</text><circle cx="181" cy="251" r="5" fill="#8b93ad"/><text x="194" y="256" class="s " font-size="14" font-weight="600" fill="#101426" text-anchor="start">Other</text><text x="194" y="274" class="m n" font-size="13" font-weight="400" fill="#555d80" text-anchor="start">1.3%</text><style>*{animation:none!important}</style>
