<clipPath id="pc1"><rect x="10" y="10" width="400" height="250" rx="18"/></clipPath>
<clipPath id="lbar"><rect x="32" y="134" width="356" height="12" rx="6"/></clipPath>
</defs>
<rect width="420" height="270" rx="20" fill="url(#bg)"/>
<g clip-path="url(#sc)"><g filter="url(#fBig)"><circle class="o1" cx="360" cy="40" r="120" fill="#5eead4" opacity="0.8"/><circle class="o2" cx="40" cy="250" r="130" fill="#a78bfa" opacity="0.8"/><circle class="o3" cx="220" cy="140" r="70" fill="#f9a8d4" opacity="0.4"/></g><rect width="420" height="270" fill="url(#dots)"/></g>
