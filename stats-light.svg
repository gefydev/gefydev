<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#222b55" stop-opacity="1"/><stop offset="1" stop-color="#10163a" stop-opacity="1"/></linearGradient>
<linearGradient id="vline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f7a" stop-opacity="0"/><stop offset="0.5" stop-color="#3b3f7a" stop-opacity="0.264"/><stop offset="1" stop-color="#3b3f7a" stop-opacity="0"/></linearGradient>
